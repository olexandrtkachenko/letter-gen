<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPAM: міні-гра за подарунок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#060606;--cobalt:#0047FF;--sea:#00F6FF;--mint:#00FFF0;--lilac:#B896FF;--sky:#7BA8FF;--iris:#8453D2;
  --bg:#F3F5FB;--surface:#FFFFFF;--surface2:#E9EDF8;--text:#060606;--muted:#4C5468;--line:#D3D9EA;
  --accent:#0047FF;--accent-text:#FFFFFF;--hi:#0047FF;--ok:#0A8F6A;--bad:#D3264B;
  --ring:0 0 0 3px rgba(0,71,255,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060606;--surface:#11131B;--surface2:#1A1D29;--text:#F4F6FF;--muted:#9AA3BD;--line:#262B3B;
    --accent:#0047FF;--accent-text:#FFFFFF;--hi:#00F6FF;--ok:#00FFB2;--bad:#FF5C7A;--ring:0 0 0 3px rgba(0,246,255,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#060606;--surface:#11131B;--surface2:#1A1D29;--text:#F4F6FF;--muted:#9AA3BD;--line:#262B3B;
  --accent:#0047FF;--accent-text:#FFFFFF;--hi:#00F6FF;--ok:#00FFB2;--bad:#FF5C7A;--ring:0 0 0 3px rgba(0,246,255,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:none;box-shadow:var(--ring)}
.wrap{max-width:520px;margin:0 auto;padding:16px 18px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 18px}
.logo{height:26px;width:auto;display:block;user-select:none;-webkit-user-drag:none}
.logo-btn{background:none;border:0;padding:6px;margin:-6px;border-radius:8px}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:block}
.event{font-size:13px;color:var(--muted);text-align:right}
main{flex:1;display:flex;flex-direction:column}
h1{font-size:clamp(30px,8.5vw,42px);line-height:1.02;letter-spacing:-.035em;font-weight:900;margin:6px 0 12px}
h2{font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:800;margin:0 0 10px}
p{margin:0 0 12px}
.lead{color:var(--muted);font-size:17px;margin-bottom:22px}
.heroes{display:flex;margin:0 0 22px}
.heroes img{width:64px;height:64px;border-radius:50%;border:3px solid var(--bg);margin-right:-12px;background:var(--surface2)}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;transition:transform .12s,border-color .12s}
.choice:active{transform:scale(.98)}
.choice:hover{border-color:var(--hi)}
.choice img,.wheel-ico{width:56px;height:56px;border-radius:50%}
.choice b{display:block;font-size:17px;letter-spacing:-.01em}
.choice span{display:block;font-size:14px;color:var(--muted);line-height:1.35}
.wheel-ico{background:conic-gradient(var(--cobalt) 0 25%,var(--sea) 0 50%,var(--lilac) 0 75%,var(--sky) 0);position:relative}
.wheel-ico::after{content:"?";position:absolute;inset:14px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-weight:900}
.choice.special{border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 22px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-text);width:100%;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn+.btn{margin-top:10px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;flex:none;font-size:20px;line-height:1}
.progress{flex:1;height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cobalt),var(--sea));transition:width .4s}
.say{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.say img{width:52px;height:52px;border-radius:50%;flex:none;background:var(--surface2)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:16px}
.bubble small{display:block;font-size:13px;font-weight:700;color:var(--hi);margin-bottom:2px}
.q{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.25;margin:4px 0 16px}
.code-snip{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;background:var(--night);color:var(--sea);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:15px;overflow-x:auto}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:500;position:relative;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--hi)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));animation:shake .35s}
.opt .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:800;margin-right:10px;vertical-align:-1px}
.feedback{min-height:24px;margin:14px 0 6px;font-size:15px;font-weight:500}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.interlude{margin:auto 0;padding:10px 0}
.interlude .big{width:96px;height:96px;border-radius:50%;margin-bottom:14px;background:var(--surface2)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--lilac) 30%,transparent);color:var(--text);margin-bottom:10px}
.interlude p.t{font-size:20px;line-height:1.4;font-weight:500;margin-bottom:24px}
/* bug hunt */
.hunt-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.timer{font-size:34px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.found{font-size:15px;color:var(--muted)}
.phone{background:#F7F8FC;color:#121522;border-radius:26px;border:8px solid #1A1D29;padding:16px 14px;max-width:360px;width:100%;margin:0 auto;position:relative}
.phone .hit{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;margin:0 0 6px;font-size:15px;color:#121522;position:relative}
.phone .hit.found{outline:2px solid #D3264B;background:rgba(211,38,75,.08)}
.phone .hit.found::after{content:"баг";position:absolute;right:6px;top:6px;font-size:11px;font-weight:800;color:#fff;background:#D3264B;border-radius:6px;padding:1px 6px}
.phone .hit.nope{animation:shake .3s}
.ph-title{font-size:20px!important;font-weight:800}
.ph-field{border:1px solid #CBD2E3!important;background:#fff!important}
.ph-label{font-size:12px!important;color:#5B6378!important;padding-bottom:0!important;margin-bottom:0!important}
.ph-bar{height:8px;background:#E2E6F0;border-radius:8px;overflow:hidden;margin-top:4px}
.ph-bar i{display:block;height:100%;width:100%;background:#0047FF}
.ph-btn{background:#0047FF!important;color:#fff!important;text-align:center!important;font-weight:700;padding:12px!important;border-radius:12px!important}
.hint{font-size:14px;color:var(--muted);text-align:center;margin-top:12px}
.penalty{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-weight:900;color:#D3264B;font-size:22px;pointer-events:none;animation:fly .8s forwards}
@keyframes fly{to{opacity:0;transform:translate(-50%,-40px)}}
/* wheel */
.wheel-box{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:8px auto 18px}
.wheel-box svg{width:100%;height:100%;display:block;transition:transform 3.6s cubic-bezier(.17,.67,.12,.99)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--text);z-index:2}
.wheel-msg{text-align:center;font-size:18px;font-weight:700;min-height:56px}
.wheel-msg small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
/* result */
.toast{display:flex;gap:10px;align-items:center;background:var(--sea);color:var(--night);font-weight:700;border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:15px;animation:pop .5s}
.toast svg{flex:none}
@keyframes pop{from{transform:translateY(-12px);opacity:0}}
.ticket{background:var(--night);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;margin-bottom:16px;border:1px solid #262B3B}
.ticket::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(0,246,255,.35),transparent 65%)}
.ticket .row{display:flex;align-items:center;gap:12px;position:relative}
.ticket img{width:58px;height:58px;border-radius:50%}
.ticket .lbl{font-size:14px;color:#9AA3BD}
.ticket .code{font-size:clamp(40px,13vw,56px);font-weight:900;letter-spacing:.06em;margin:14px 0 4px;position:relative;font-variant-numeric:tabular-nums;color:#fff}
.ticket .meta{font-size:14px;color:#9AA3BD;position:relative}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.share{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.share h3{margin:0 0 6px;font-size:18px}
.share p{color:var(--muted);font-size:15px}
.small-link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;margin:14px auto 0;display:block}
/* staff */
.overlay{position:fixed;inset:0;background:rgba(6,6,6,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:22px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.sheet input{width:100%;font:inherit;font-size:24px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin:6px 0 12px}
.verdict{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:15px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.verdict.warn{background:color-mix(in srgb,#FFB020 25%,transparent)}
.issued{font-size:14px;color:var(--muted);margin:12px 0 0;max-height:120px;overflow:auto}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:5;width:100%;height:100%}
.fade{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
@media (min-width:900px){
  .wrap{padding-top:40px}
  body{background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--cobalt) 22%,transparent),transparent 60%),var(--bg)}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const NAMES = {max:"Макс",sofia:"Софія",bite:"Байт"};
const GAMES = {
  quest:{title:"Квест Байта",hero:"bite",prefix:"K",desc:"Допоможи робо-котику повернути 4 шматки коду"},
  roles:{title:"Вгадай професію",hero:"sofia",prefix:"P",desc:"Софія описує роботу, а ти вгадуєш, хто це"},
  bugs:{title:"Знайди баг",hero:"max",prefix:"M",desc:"5 багів на екрані, 60 секунд, вперед"}
};
const KEY = "epamEventGame.v1", STAFF_KEY = "epamEventGame.staff.v1";
const ALPH = "ACDEFHJKLMNPRTUVWXY34679";
const $app = document.getElementById("app");
document.getElementById("eventName").textContent = CONFIG.eventName;

function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild}
function show(node){$app.innerHTML="";node.classList.add("fade");$app.appendChild(node);window.scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- коди ---------- */
function checkChar(body){let h=0;const s=CONFIG.secret;for(let i=0;i<body.length;i++){h=(h*31+ALPH.indexOf(body[i])*(i+7)+s.charCodeAt(i%s.length))%9973}return ALPH[h%ALPH.length]}
function makeCode(prefix){const r=new Uint32Array(4);crypto.getRandomValues(r);let b=prefix;for(const x of r)b+=ALPH[x%ALPH.length];const c=b+checkChar(b);return c.slice(0,3)+"-"+c.slice(3)}
function normCode(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/0/g,"D").replace(/O/g,"D").replace(/B/g,"8")}
function validCode(s){const c=normCode(s);if(c.length!==6)return false;if(!"KPM".includes(c[0]))return false;for(const ch of c)if(!ALPH.includes(ch))return false;return checkChar(c.slice(0,5))===c[5]}

/* ---------- черга фактів і жартів ---------- */
let pool=[];
function nextInterlude(){if(!pool.length){const f=FACTS.map(t=>({kind:"fact",hero:["bite","sofia","max"][Math.floor(Math.random()*3)],text:t}));const j=JOKES.map(([h,t])=>({kind:"joke",hero:h,text:t}));const fs=shuffle(f),js=shuffle(j);pool=[];while(fs.length||js.length){if(fs.length)pool.push(fs.pop());if(js.length)pool.push(js.pop())}}return pool.shift()}

/* ---------- головний екран ---------- */
function home(){
  const saved=store(KEY);
  const n=el(`<section>
    <div class="heroes"><img src="${IMG.max}" alt="Макс"><img src="${IMG.sofia}" alt="Софія"><img src="${IMG.bite}" alt="Байт"></div>
    <h1>Зіграй 2 хвилини — забери подарунок</h1>
    <p class="lead">Обери гру. Пройдеш — отримаєш код, який треба показати на стенді EPAM.</p>
    <div class="choices">
      ${Object.entries(GAMES).map(([id,g])=>`<button class="choice" data-g="${id}"><img src="${IMG[g.hero]}" alt=""><div><b>${g.title}</b><span>${g.desc}</span></div></button>`).join("")}
      <button class="choice special" data-g="wheel"><div class="wheel-ico" aria-hidden="true"></div><div><b>Колесо фортуни</b><span>Не можеш обрати? Нехай колесо вирішить за тебе</span></div></button>
    </div>
    ${saved?`<button class="small-link" id="mycode">Мій код подарунка: ${saved.code}</button>`:""}
  </section>`);
  n.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const g=b.dataset.g;g==="wheel"?wheel():startGame(g)});
  const mc=n.querySelector("#mycode");if(mc)mc.onclick=()=>result(saved.game,false);
  show(n);
}

/* ---------- рушій кроків ---------- */
function runSteps(gameId,steps){
  let i=0;const total=steps.filter(s=>s.type!=="interlude").length;let done=0;
  function frame(inner){
    const f=el(`<section><div class="topbar"><button class="back" aria-label="На головну">‹</button><div class="progress"><i style="width:${Math.round(done/total*100)}%"></i></div></div></section>`);
    f.querySelector(".back").onclick=()=>{stopAll();home()};
    f.appendChild(inner);return f;
  }
  function next(){
    if(i>=steps.length){result(gameId,true);return}
    const s=steps[i++];
    if(s.type==="interlude"){interlude(next);return}
    const advance=()=>{done++;next()};
    if(s.type==="mcq")show(frame(mcq(s,advance)));
    else if(s.type==="order")show(frame(order(s,advance)));
    else if(s.type==="bugs")show(frame(bugHunt(s,advance)));
  }
  next();
}
function interlude(cb){
  const it=nextInterlude();
  const n=el(`<section class="interlude">
    <img class="big" src="${IMG[it.hero]}" alt="${NAMES[it.hero]}">
    <div class="tag">${it.kind==="fact"?"Факт про EPAM":"Жарт від "+(it.hero==="bite"?"Байта":it.hero==="max"?"Макса":"Софії")}</div>
    <p class="t">${esc(it.text)}</p>
    <button class="btn">Далі</button></section>`);
  n.querySelector(".btn").onclick=cb;show(n);
}
function sayBlock(hero,text,label){return `<div class="say"><img src="${IMG[hero]}" alt="${NAMES[hero]}"><div class="bubble"><small>${label||NAMES[hero]}</small>${text}</div></div>`}

function mcq(s,done){
  const idx=shuffle(s.options.map((_,k)=>k));
  const n=el(`<div>${s.say?sayBlock(s.hero,s.say):""}<div class="q">${s.q}</div>${s.code?`<pre class="code-snip">${esc(s.code)}</pre>`:""}
    <div class="opts">${idx.map(k=>`<button class="opt" data-k="${k}">${esc(s.options[k])}</button>`).join("")}</div>
    <div class="feedback" role="status"></div><div class="nx"></div></div>`);
  const fb=n.querySelector(".feedback");let solved=false;
  n.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(solved)return;const k=+b.dataset.k;
    if(k===s.correct){solved=true;b.classList.add("ok");fb.className="feedback ok";fb.textContent=s.win||"Правильно!";
      const nb=el(`<button class="btn" style="margin-top:6px">Далі</button>`);nb.onclick=done;n.querySelector(".nx").appendChild(nb);nb.focus()}
    else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");fb.className="feedback bad";fb.textContent=(s.wrong&&s.wrong[k])||"Не зовсім. Спробуй ще раз."}
  });
  return n;
}
function order(s,done){
  const items=shuffle(s.items.map((t,k)=>({t,k})));let seq=[];
  const n=el(`<div>${s.say?sayBlock(s.hero,s.say):""}<div class="q">${s.q}</div>
    <div class="opts">${items.map(it=>`<button class="opt" data-k="${it.k}">${esc(it.t)}</button>`).join("")}</div>
    <div class="feedback" role="status"></div><div class="nx"></div></div>`);
  const fb=n.querySelector(".feedback");const btns=[...n.querySelectorAll(".opt")];
  function paint(){btns.forEach(b=>{const p=seq.indexOf(+b.dataset.k);const txt=s.items[+b.dataset.k];b.innerHTML=(p>=0?`<span class="n">${p+1}</span>`:"")+esc(txt)})}
  btns.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;if(seq.includes(k)||seq.length===s.items.length)return;
    if(k!==seq.length){b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");fb.className="feedback bad";fb.textContent=s.wrong||"Порядок збився. Почнімо спочатку.";seq=[];paint();return}
    seq.push(k);b.classList.remove("bad");paint();fb.textContent="";
    if(seq.length===s.items.length){btns.forEach(x=>x.classList.add("ok"));fb.className="feedback ok";fb.textContent=s.win||"Ідеальний порядок!";
      const nb=el(`<button class="btn" style="margin-top:6px">Далі</button>`);nb.onclick=done;n.querySelector(".nx").appendChild(nb)}
  });
  return n;
}

/* ---------- гра 3: знайди баг ---------- */
let timerId=null;function stopAll(){if(timerId){clearInterval(timerId);timerId=null}}
function bugHunt(s,done){
  let left=CONFIG.bugTime,found=0;const need=5;
  const n=el(`<div>
    ${sayBlock("max","Це форма реєстрації, яку «ніхто не тестував». Тицяй на все, що виглядає як помилка. Зайвий тап — мінус 3 секунди.")}
    <div class="hunt-head"><div class="timer" aria-live="off">${left}</div><div class="found">Знайдено: <b class="fc">0</b> з ${need}</div></div>
    <div class="phone">
      <button class="hit ph-title" data-bug="1">Реєстарція на IT-івент</button>
      <button class="hit ph-label" data-bug="0">Ім'я</button>
      <button class="hit ph-field" data-bug="0">Олена</button>
      <button class="hit ph-label" data-bug="0">Email</button>
      <button class="hit ph-field" data-bug="1">olena@@gmail.com</button>
      <button class="hit ph-label" data-bug="0">Дата події</button>
      <button class="hit ph-field" data-bug="1">31.02.2026</button>
      <button class="hit ph-label" data-bug="0">Вартість квитка</button>
      <button class="hit ph-field" data-bug="1">−150 грн</button>
      <button class="hit" data-bug="1" style="font-size:13px">Форму заповнено на 110%<div class="ph-bar"><i></i></div></button>
      <button class="hit" data-bug="0" style="font-size:13px;color:#5B6378">Погоджуюсь з правилами участі</button>
      <button class="hit ph-btn" data-bug="0">Зареєструватися</button>
    </div>
    <p class="hint">Підказка: шукай друкарські помилки, дивні дати, числа й відсотки.</p>
    <div class="feedback" role="status"></div><div class="nx"></div></div>`);
  const t=n.querySelector(".timer"),fc=n.querySelector(".fc"),fb=n.querySelector(".feedback"),phone=n.querySelector(".phone");
  let over=false;
  function finish(win){
    over=true;stopAll();
    if(win){fb.className="feedback ok";fb.textContent=found===need?"Усі 5 багів! Макс береже тебе в команду QA.":`Знайдено ${found} з ${need}. Для першого разу — чудовий результат!`;
      const nb=el(`<button class="btn">Далі</button>`);nb.onclick=done;n.querySelector(".nx").appendChild(nb)}
    else{fb.className="feedback bad";fb.textContent=`Час вийшов: ${found} з ${need}. Потрібно хоча б 3.`;
      const nb=el(`<button class="btn">Спробувати ще раз</button>`);nb.onclick=()=>show(wrapBack(bugHunt(s,done)));n.querySelector(".nx").appendChild(nb)}
  }
  n.querySelectorAll(".hit").forEach(b=>b.onclick=()=>{
    if(over||b.classList.contains("found"))return;
    if(b.dataset.bug==="1"){b.classList.add("found");found++;fc.textContent=found;if(found===need)finish(true)}
    else{left=Math.max(0,left-3);t.textContent=left;b.classList.remove("nope");void b.offsetWidth;b.classList.add("nope");
      const p=el(`<div class="penalty">−3 с</div>`);phone.appendChild(p);setTimeout(()=>p.remove(),800)}
  });
  stopAll();
  timerId=setInterval(()=>{left--;t.textContent=Math.max(0,left);t.classList.toggle("low",left<=10);if(left<=0)finish(found>=3)},1000);
  return n;
}
function wrapBack(inner){const f=el(`<section><div class="topbar"><button class="back" aria-label="На головну">‹</button><div class="progress"><i style="width:0%"></i></div></div></section>`);f.querySelector(".back").onclick=()=>{stopAll();home()};f.appendChild(inner);return f}

/* ---------- сценарії ігор ---------- */
function startGame(id){
  stopAll();
  if(id==="quest")runSteps("quest",[
    {type:"interlude"},
    {type:"order",hero:"bite",say:"Мяу! Після оновлення я загубив 4 шматки свого коду. Перший — це план роботи команди.",q:"Розстав події Scrum-спринту в правильному порядку",items:["Sprint Planning","Daily Scrum","Sprint Review","Sprint Retrospective"],win:"Спринт зібрано! Шматок №1 повернуто."},
    {type:"mcq",hero:"bite",say:"Шматок №2 застряг у JavaScript.",q:"Що виведе цей код?",code:'console.log("2" + 2);',options:["4","22","NaN","Помилку"],correct:1,wrong:{0:"Логічно, але JavaScript склеює рядок і число.",2:"NaN буде, якщо відняти щось дивне. Тут — склеювання.",3:"JavaScript рідко падає. Він просто робить щось несподіване."},win:"Так, «22». JavaScript такий JavaScript."},
    {type:"interlude"},
    {type:"mcq",hero:"bite",say:"Шматок №3 записаний у двійковому коді. Я ж робот, мені так зручніше.",q:"Яке число записано як 1010 у двійковій системі?",options:["10","1010","5","12"],correct:0,win:"8 + 2 = 10. Мяу-правильно!"},
    {type:"mcq",hero:"bite",say:"Останній шматок! Треба зберегти всі зміни в репозиторій.",q:"Яку команду виконати?",options:["git commit","git push --force у п'ятницю","git meow","Ctrl+S і помолитися"],correct:0,wrong:{1:"Байт ховається під стіл. Тільки не force і точно не в п'ятницю!",2:"Мило, але такої команди Git не знає.",3:"Ctrl+S зберігає файл, а не історію змін."},win:"Код зібрано! Байт знову онлайн."}
  ]);
  if(id==="roles"){
    const all=["QA Engineer","Business Analyst","DevOps Engineer","UX/UI Designer","Project Manager","Frontend Developer","Backend Developer","Data Analyst"];
    const qs=[
      ["Я ламаю застосунок раніше за користувачів і пишу баг-репорти.","QA Engineer"],
      ["Я розмовляю з замовником і перетворюю «хочу, щоб було красиво» на чіткі вимоги.","Business Analyst"],
      ["Я налаштовую CI/CD, щоб код сам потрапляв на сервер, поки команда п'є каву.","DevOps Engineer"],
      ["Я малюю екрани у Figma і сперечаюся, чи кнопка має бути на 2 пікселі лівіше.","UX/UI Designer"],
      ["Я тримаю дедлайни, ризики і команду в одному Jira-борді.","Project Manager"]
    ];
    const steps=[{type:"interlude"}];
    qs.forEach(([d,a],k)=>{
      const opts=[a,...shuffle(all.filter(x=>x!==a)).slice(0,3)];
      steps.push({type:"mcq",hero:"sofia",say:d,q:"Хто це говорить?",options:opts,correct:0,win:`Так, це ${a}!`});
      if(k===1||k===3)steps.push({type:"interlude"});
    });
    runSteps("roles",steps);
  }
  if(id==="bugs")runSteps("bugs",[{type:"interlude"},{type:"bugs"},{type:"interlude"}]);
}

/* ---------- колесо фортуни ---------- */
function wheel(){
  stopAll();
  const seg=[{id:"quest",label:"Квест",c:"#0047FF",t:"#fff"},{id:"roles",label:"Професії",c:"#00F6FF",t:"#060606"},{id:"bugs",label:"Баги",c:"#B896FF",t:"#060606"},{id:"wheel",label:"Колесо",c:"#7BA8FF",t:"#060606"}];
  const R=100;
  const paths=seg.map((s,i)=>{const a0=(i*90-90)*Math.PI/180,a1=((i+1)*90-90)*Math.PI/180;const x0=R+R*Math.cos(a0),y0=R+R*Math.sin(a0),x1=R+R*Math.cos(a1),y1=R+R*Math.sin(a1);
    const am=(i*90+45-90)*Math.PI/180,tx=R+62*Math.cos(am),ty=R+62*Math.sin(am);
    return `<path d="M${R},${R} L${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} Z" fill="${s.c}"/><text x="${tx}" y="${ty}" fill="${s.t}" font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(${i*90+45} ${tx} ${ty})" font-family="Inter,Arial,sans-serif">${s.label}</text>`}).join("");
  const n=el(`<section><div class="topbar"><button class="back" aria-label="На головну">‹</button><div class="progress"><i style="width:0%"></i></div></div>
    ${sayBlock("bite","Крутимо колесо! Куди воно вкаже — ту гру й граєш.")}
    <div class="wheel-box"><div class="pointer"></div><svg viewBox="0 0 200 200" role="img" aria-label="Колесо фортуни">${paths}<circle cx="100" cy="100" r="18" fill="#060606"/><circle cx="100" cy="100" r="7" fill="#00F6FF"/></svg></div>
    <div class="wheel-msg" role="status"></div>
    <button class="btn" id="spin">Крутити</button></section>`);
  n.querySelector(".back").onclick=home;
  const svg=n.querySelector("svg"),msg=n.querySelector(".wheel-msg"),btn=n.querySelector("#spin");
  let rot=0,depth=0;
  function spin(){
    btn.disabled=true;btn.style.opacity=.5;
    let pick=Math.floor(Math.random()*4);
    if(depth===0&&Math.random()<0.35)pick=3;
    if(depth>=2&&pick===3)pick=Math.floor(Math.random()*3);
    const jitter=Math.random()*50-25;
    const desired=((360-(pick*90+45)+jitter)%360+360)%360;
    rot=rot+360*5+((desired-(rot%360))+360)%360;
    svg.style.transform=`rotate(${rot}deg)`;
    msg.textContent="";
    const dur=matchMedia("(prefers-reduced-motion: reduce)").matches?50:3700;
    setTimeout(()=>{
      if(pick===3){depth++;
        msg.innerHTML=depth===1?`Колесо випало на колесо. Рекурсія!<small>Байт: «Без паніки, базовий випадок уже близько». Крутимо ще раз…</small>`:`Рекурсія в рекурсії!<small>Ще трохи — і буде StackOverflow. Останнє коло…</small>`;
        setTimeout(spin,1700);
      } else {
        msg.innerHTML=`Тобі випало: ${GAMES[seg[pick].id].title}<small>Стартуємо…</small>`;
        setTimeout(()=>startGame(seg[pick].id),1600);
      }
    },dur);
  }
  btn.onclick=spin;
  show(n);
}

/* ---------- результат ---------- */
function result(gameId,fresh){
  stopAll();
  let saved=store(KEY);
  if(!saved){saved={code:makeCode(GAMES[gameId].prefix),game:gameId,at:Date.now()};store(KEY,saved)}
  const g=GAMES[saved.game]||GAMES[gameId];
  const d=new Date(saved.at);
  const when=d.toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"})+", "+d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  const n=el(`<section>
    <div class="toast" role="alert"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Зроби скріншот цього екрана</div>
    <h2>${fresh?"Перемога!":"Твій код подарунка"}</h2>
    <p class="lead" style="margin-bottom:16px">Покажи цей екран на стенді EPAM. Колега запише код і видасть подарунок. Один код — один подарунок.</p>
    <div class="ticket">
      <div class="row"><img src="${IMG[g.hero]}" alt="${NAMES[g.hero]}"><div><div class="lbl">Гра</div><b>${g.title}</b></div></div>
      <div class="code">${saved.code}</div>
      <div class="meta"><span class="live"></span>Отримано ${when}</div>
    </div>
    <div class="share">
      <h3>Останній крок: розкажи друзям</h3>
      <p>Виклади сторіз або пост про івент з хештегом <b>${esc(CONFIG.hashtag)}</b> і покажи його на стенді разом із кодом.</p>
      <button class="btn" id="shareBtn">Поділитися івентом</button>
      <button class="btn ghost" id="copyBtn">Скопіювати текст для сторіз</button>
    </div>
    <button class="small-link" id="again">Зіграти ще раз (код не зміниться)</button>
  </section>`);
  const text=`${CONFIG.shareText} ${CONFIG.eventName} ${CONFIG.hashtag}`;
  n.querySelector("#shareBtn").onclick=async()=>{
    if(navigator.share){try{await navigator.share({title:"EPAM: міні-гра",text,url:location.href})}catch(e){}}
    else copy(text+" "+location.href,n.querySelector("#shareBtn"),"Посилання скопійовано");
  };
  n.querySelector("#copyBtn").onclick=e=>copy(text,e.currentTarget,"Текст скопійовано");
  n.querySelector("#again").onclick=home;
  show(n);
  if(fresh)confetti();
}
function copy(t,btn,ok){const done=()=>{const o=btn.textContent;btn.textContent=ok;setTimeout(()=>btn.textContent=o,1800)};
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>{fallbackCopy(t);done()});else{fallbackCopy(t);done()}}
function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}

/* ---------- конфеті ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cols=["#0047FF","#00F6FF","#B896FF","#7BA8FF","#00FFF0"];
  const ps=Array.from({length:140},()=>({x:W/2,y:H*0.3,vx:(Math.random()-.5)*18*devicePixelRatio,vy:(Math.random()*-14-4)*devicePixelRatio,s:(Math.random()*6+4)*devicePixelRatio,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=0.45*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.r+=0.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<160)requestAnimationFrame(tick);else x.clearRect(0,0,W,H)})();
}

/* ---------- панель для стенду (5 тапів по логотипу) ---------- */
let taps=[];
document.getElementById("logoBtn").onclick=()=>{const now=Date.now();taps=taps.filter(t=>now-t<2500);taps.push(now);if(taps.length>=5){taps=[];staffPin()}};
function staffPin(){
  const o=el(`<div class="overlay"><div class="sheet"><h2>Режим стенду</h2><p style="color:var(--muted)">Введіть PIN організатора.</p><input id="pin" inputmode="numeric" autocomplete="off" placeholder="••••"><div class="feedback bad" id="pe"></div><button class="btn" id="go">Увійти</button><button class="btn ghost" id="cl">Закрити</button></div></div>`);
  document.body.appendChild(o);const i=o.querySelector("#pin");i.focus();
  const go=()=>{if(i.value.trim()===CONFIG.staffPin){o.remove();staff()}else o.querySelector("#pe").textContent="Невірний PIN"};
  o.querySelector("#go").onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};o.querySelector("#cl").onclick=()=>o.remove();
}
function staff(){
  const list=()=>store(STAFF_KEY)||[];
  const o=el(`<div class="overlay"><div class="sheet">
    <h2>Перевірка коду</h2>
    <p style="color:var(--muted);font-size:15px">Введіть код із екрана гравця. Список виданих кодів зберігається на цьому телефоні.</p>
    <input id="code" autocomplete="off" autocapitalize="characters" placeholder="K7M-HX4">
    <div id="verdict"></div>
    <button class="btn" id="give">Видати подарунок</button>
    <button class="btn ghost" id="close">Закрити</button>
    <div class="issued" id="issued"></div>
    <button class="small-link" id="reset">Скинути гру на цьому пристрої (для тесту)</button>
  </div></div>`);
  document.body.appendChild(o);
  const inp=o.querySelector("#code"),v=o.querySelector("#verdict"),iss=o.querySelector("#issued");
  function renderList(){const l=list();iss.innerHTML=l.length?`Видано: <b>${l.length}</b><br>${l.slice().reverse().map(x=>esc(x.code)+" — "+new Date(x.at).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"})).join("<br>")}`:"Ще нічого не видано."}
  function check(){const c=normCode(inp.value);if(c.length<6){v.innerHTML="";return null}
    const pretty=c.slice(0,3)+"-"+c.slice(3);
    if(!validCode(c)){v.innerHTML=`<div class="verdict bad">Код ${esc(pretty)} не проходить перевірку. Перепитайте або попросіть показати екран ще раз.</div>`;return null}
    const dup=list().find(x=>normCode(x.code)===c);
    if(dup){v.innerHTML=`<div class="verdict warn">Код ${esc(pretty)} уже отримав подарунок о ${new Date(dup.at).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"})}.</div>`;return null}
    v.innerHTML=`<div class="verdict ok">Код ${esc(pretty)} справжній і ще не використаний.</div>`;return pretty}
  inp.oninput=check;inp.focus();
  o.querySelector("#give").onclick=()=>{const p=check();if(!p)return;const l=list();l.push({code:p,at:Date.now()});store(STAFF_KEY,l);v.innerHTML=`<div class="verdict ok">Видано: ${esc(p)}</div>`;inp.value="";renderList()};
  o.querySelector("#close").onclick=()=>o.remove();
  o.querySelector("#reset").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}o.remove();home()};
  renderList();
}

home();
</script>
