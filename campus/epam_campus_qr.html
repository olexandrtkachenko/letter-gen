body.light{background:#F6F7FB;color:#0B0B12;
  --grad:linear-gradient(90deg,#0078C2 0%,#0047FF 55%,#8453D2 100%);
  --ink:#0B0B12; --muted:rgba(11,11,18,.62); --line:rgba(11,11,18,.14)}
body.light .bg.light{opacity:1}
body.light .glow{opacity:.18;background:radial-gradient(circle,#00B8FF 0%,#B896FF 45%,transparent 70%)}
body.light .lockup.dk, body:not(.light) .lockup.lt{display:none}
body.light .scan i{background:#0047FF;box-shadow:0 0 10px rgba(0,71,255,.6)}
body.light .icon{background:rgba(11,11,18,.05)}
body.light .icon svg [fill="#fff"]{fill:#0B0B12} body.light .icon svg[stroke="#fff"]{stroke:#0B0B12}
body.light .url{background:rgba(255,255,255,.7)}
body.light .tab.on{color:#0B0B12}
body.light .card{box-shadow:0 24px 60px rgba(0,71,255,.18),0 0 0 1px rgba(11,11,18,.06)}
body.light .ctrls button{background:rgba(255,255,255,.75);color:#0B0B12}
.glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(8vmax);opacity:.38;pointer-events:none;
  background:radial-gradient(circle,#0047FF 0%,#8453D2 45%,transparent 70%);left:-25vmax;top:-30vmax;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(12vmax,10vmax) scale(1.1)}}

.stage{position:absolute;inset:0;display:grid;
  padding:max(4vmin,env(safe-area-inset-top)) max(5vmin,env(safe-area-inset-right)) max(4vmin,env(safe-area-inset-bottom)) max(5vmin,env(safe-area-inset-left));
  grid-template-rows:auto 1fr auto;gap:3vmin}
header{display:flex;align-items:center;justify-content:space-between}
header img.lockup{height:clamp(30px,6.2vmin,74px);width:auto;display:block}
.scan{font-weight:300;font-size:clamp(13px,2.1vmin,22px);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.7em}
.scan i{width:.65em;height:.65em;border-radius:50%;background:#00FFF0;box-shadow:0 0 12px #00FFF0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

main{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6vmin;min-height:0}
.info{min-width:0}
.icon{width:clamp(44px,8vmin,92px);height:clamp(44px,8vmin,92px);border-radius:24%;display:grid;place-items:center;
  background:rgba(255,255,255,.08);border:1px solid var(--line);margin-bottom:3.2vmin}
.icon svg{width:56%;height:56%}
.eyebrow{font-weight:500;font-size:clamp(13px,2.2vmin,24px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:1.4vmin}
h1{color:var(--ink);font-weight:300;font-size:clamp(34px,8.4vmin,104px);line-height:1.04;letter-spacing:-.01em}
h1 b{font-weight:500;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{font-weight:300;font-size:clamp(17px,3.3vmin,38px);color:var(--muted);margin-top:2.4vmin;line-height:1.3;max-width:22em}
.url{display:inline-block;margin-top:4vmin;padding:.62em 1.15em;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);font-weight:500;font-size:clamp(14px,2.5vmin,28px);letter-spacing:.06em}

.card{position:relative;width:min(62vmin,46vw);aspect-ratio:1;border-radius:6%;background:#fff;padding:7%;
  box-shadow:0 30px 80px rgba(0,71,255,.35),0 0 0 1px rgba(255,255,255,.4)}
.card::before{content:"";position:absolute;inset:-3px;border-radius:inherit;padding:3px;background:var(--grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.9}
.qr{position:absolute;inset:7%;display:grid}
.qr svg{width:100%;height:100%;display:block}

.swap{transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.out .swap{opacity:0;transform:translateY(1.6vmin)}
.out .card .qr{opacity:0;transform:scale(.94)}
.card .qr{transition:opacity .45s ease,transform .45s ease}

footer{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2vmin}
.tab em{font-style:normal}
.tab{cursor:pointer;padding-top:1.6vmin;color:var(--muted);font-weight:300;font-size:clamp(12px,1.9vmin,20px);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:1.3vmin}
.bar span{display:block;height:100%;width:0;background:var(--grad)}
.tab.done .bar span{width:100%}
.tab.on{color:var(--ink);font-weight:500}
.tab.on .bar span{animation:fill var(--dur) linear forwards}
.paused .tab.on .bar span{animation-play-state:paused}
@keyframes fill{to{width:100%}}

.ctrls{position:absolute;right:max(2vmin,env(safe-area-inset-right));bottom:calc(max(4vmin,env(safe-area-inset-bottom)) + 7vmin);
  display:flex;gap:.6em;opacity:.9;transition:opacity .4s}
.ctrls.hide{opacity:0;pointer-events:none}
.ctrls button{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:.6em 1em;
  font:500 clamp(12px,1.8vmin,18px) "Museo",sans-serif;cursor:pointer;min-width:3.2em;display:inline-flex;align-items:center;justify-content:center;gap:.4em}
.ctrls svg{width:1.15em;height:1.15em;display:block}

/* Portrait */
@media (orientation:portrait){
  main{grid-template-columns:1fr;grid-template-rows:auto auto;justify-items:center;text-align:center;align-content:center;gap:5vmin}
  .card{order:-1;width:min(78vw,52vh)}
  .icon{display:none}
  .scan{display:none}
  .ctrls{top:max(4vmin,env(safe-area-inset-top));bottom:auto;right:max(5vmin,env(safe-area-inset-right))}
  .desc{margin-left:auto;margin-right:auto}
  h1{font-size:clamp(34px,9vmin,96px)}
}
</style>
</head>
<body>
<div class="bg"></div><div class="bg light"></div><div class="glow"></div>

const ICONS = {
  site:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.6 4.2 5.8 4.2 9.5s-1.4 6.9-4.2 9.5M12 2.5C9.2 5.1 7.8 8.3 7.8 12s1.4 6.9 4.2 9.5"/></svg>',
  tg:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M21.4 3.6 2.9 10.8c-1.2.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.4ZM8.3 13.5l9.9-6.3c.5-.3.9-.1.5.2l-8.5 7.7-.3 3.6-1.6-5.2Z"/></svg>',
  fb:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M13.6 21.5v-8h2.7l.4-3.2h-3.1V8.3c0-.9.3-1.5 1.6-1.5h1.6V4c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.4H7.7v3.2h2.7v8h3.2Z"/></svg>'
};
const T = {
  uk:{scan:'Скануй камерою телефона', fs:'⤢ На весь екран', slides:[
    {eyebrow:'Наш сайт',       title:'Сайт <b>EPAM Campus</b>',     desc:'Програми, кар’єрний шлях і події',                tab:'Сайт'},
    {eyebrow:'Telegram-канал', title:'<b>Telegram</b> EPAM Campus', desc:'Новини та нові набори',                           tab:'Telegram'},
    {eyebrow:'Facebook',       title:'<b>Facebook</b> EPAM Campus', desc:'Події та історії студентів',                      tab:'Facebook'},
    {eyebrow:'Telegram-канал', title:'Telegram <b>Internship</b>',  desc:'Анонси та реєстрація на студентську інтернатуру', tab:'Internship'}]},
  en:{scan:'Scan with your phone camera', fs:'⤢ Fullscreen', slides:[
    {eyebrow:'Our website',      title:'<b>EPAM Campus</b> website',  desc:'Programs, career journey and events',          tab:'Website'},
    {eyebrow:'Telegram channel', title:'<b>Telegram</b> EPAM Campus', desc:'News and new intakes',                         tab:'Telegram'},
    {eyebrow:'Facebook',         title:'<b>Facebook</b> EPAM Campus', desc:'Events and student stories',                   tab:'Facebook'},
    {eyebrow:'Telegram channel', title:'Telegram <b>Internship</b>',  desc:'Announcements and registration for the student internship', tab:'Internship'}]}
};
const SLIDES = [
  {id:'site',  icon:'site', url:'epa.ms/campus26site'},
  {id:'tg',    icon:'tg',   url:'epa.ms/campus26tg'},
  {id:'fb',    icon:'fb',   url:'epa.ms/campus26fb'},
  {id:'intern',icon:'tg',   url:'t.me/EPAMStudPractice'}
];
const store = { get(k,d){ try{ return localStorage.getItem(k)||d }catch(_){ return d } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(_){} } };
let lang = store.get('qr_lang','uk'), theme = store.get('qr_theme','dark');
const DUR = 10000;
const $ = id => document.getElementById(id);
const stage = $('stage'), tabs = $('tabs');
let i = 0, timer = null, paused = false;

tabs.style.setProperty('--n', SLIDES.length);
document.documentElement.style.setProperty('--dur', DUR/1000+'s');
tabs.innerHTML = SLIDES.map((s,k)=>`<div class="tab" data-k="${k}"><div class="bar"><span></span></div><em></em></div>`).join('');
function applyPrefs(){
  document.documentElement.lang = lang;
  document.body.classList.toggle('light', theme==='light');
  $('scan').textContent = T[lang].scan;
  $('fs').textContent = T[lang].fs;
  $('lang').textContent = lang==='uk' ? 'EN' : 'UA';
  $('theme').innerHTML = theme==='light'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  [...tabs.children].forEach((t,n)=>t.querySelector('em').textContent = T[lang].slides[n].tab);
}

function render(k){
  const s = Object.assign({}, SLIDES[k], T[lang].slides[k]);
  $('icon').innerHTML = ICONS[s.icon];
  $('eyebrow').textContent = s.eyebrow;
  $('title').innerHTML = s.title;
  $('desc').textContent = s.desc;
  $('url').textContent = s.url;
  $('qr').innerHTML = QR[s.id];
  [...tabs.children].forEach((t,n)=>{
    t.classList.toggle('done', n<k);
    t.classList.remove('on'); void t.offsetWidth;
    t.classList.toggle('on', n===k);
  });
}
function go(k, animate=true){
  i = (k + SLIDES.length) % SLIDES.length;
  clearTimeout(timer);
  if(!animate){ render(i); schedule(); return; }
  stage.classList.add('out');
  setTimeout(()=>{ render(i); stage.classList.remove('out'); schedule(); }, 450);
}
function schedule(){ clearTimeout(timer); if(!paused) timer = setTimeout(()=>go(i+1), DUR); }

// Controls: tap a tab to jump; tap left/right half or swipe to step; long press pauses.
tabs.addEventListener('click', e=>{ const t=e.target.closest('.tab'); if(t){ e.stopPropagation(); go(+t.dataset.k); }});
let sx=null, pressT=null;
stage.addEventListener('pointerdown', e=>{ sx=e.clientX; pressT=setTimeout(()=>{ paused=!paused; stage.classList.toggle('paused',paused); if(!paused) go(i,false); else clearTimeout(timer); sx=null; }, 700); });
stage.addEventListener('pointerup', e=>{
  clearTimeout(pressT); if(sx===null) return;
  const dx = e.clientX - sx; sx=null;
  if(e.target.closest('.tab')) return;
  if(Math.abs(dx)>50) go(i + (dx<0?1:-1));
  else go(i + (e.clientX < innerWidth/2 ? -1 : 1));
});
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(i+1);
  if(e.key==='ArrowLeft') go(i-1);
  if(e.key==='f') toggleFs();
  if(e.key==='l') $('lang').click();
  if(e.key==='t') $('theme').click();
});

// Fullscreen + keep screen awake
const fsBtn = $('ctrls');
let wake = null;
async function keepAwake(){ try{ if('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); }catch(_){} }
async function toggleFs(){
  const d=document, el=d.documentElement;
  try{
    if(!(d.fullscreenElement||d.webkitFullscreenElement)){
      (el.requestFullscreen? await el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen());
    } else {
      (d.exitFullscreen? await d.exitFullscreen() : d.webkitExitFullscreen && d.webkitExitFullscreen());
    }
  }catch(_){}
  keepAwake();
}
fsBtn.addEventListener('pointerdown', e=>e.stopPropagation());
fsBtn.addEventListener('pointerup', e=>e.stopPropagation());
$('fs').addEventListener('click', e=>{ e.stopPropagation(); toggleFs(); });
$('lang').addEventListener('click', e=>{ e.stopPropagation(); lang = lang==='uk'?'en':'uk'; store.set('qr_lang',lang); applyPrefs(); render(i); });
$('theme').addEventListener('click', e=>{ e.stopPropagation(); theme = theme==='light'?'dark':'light'; store.set('qr_theme',theme); applyPrefs(); });
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  $('fs').style.display = (document.fullscreenElement||document.webkitFullscreenElement) ? 'none' : '';
}));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && wake!==null) keepAwake(); });
// Hide the button after a while if nobody taps it (standalone / Guided Access mode)
setTimeout(()=>fsBtn.classList.add('hide'), 20000);
stage.addEventListener('pointerdown', ()=>{ fsBtn.classList.remove('hide'); clearTimeout(window._fsT); window._fsT=setTimeout(()=>fsBtn.classList.add('hide'),6000); });

applyPrefs();
go(0,false);
</script>
